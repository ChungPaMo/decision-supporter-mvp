[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chungpamo-mvp-modules"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic==2.14.2"]

[tool.setuptools.packages.find]
where = ["modules/planning_engine", "modules/file_classifier/src", "."]
include = ["engine*", "mps*", "rccp*", "mrp*", "what_if*", "file_classifier*", "contracts.interfaces*"]
namespaces = true
